dataset:
  name: nyu_depth_v2
  rgb_dir: data/nyu/rgb
  depth_dir: data/nyu/depth
  depth_scale: 1000.0
  max_depth_m: 10.0
  split: official_test

experiment:
  model_name: depth_anything_v2_relative_small
  align_scale_shift: true
  error_percentile: 85.0
  min_region_area: 25
  include_reflection: true
  texture_variance_scale: 500.0
  edge_density_scale: 3.0
  contrast_scale: 60.0
  occlusion_scale: 1.0
  reflection_scale: 5.0
  ambiguity_margin: 0.10
  random_seed: 42

outputs:
  directory: outputs
