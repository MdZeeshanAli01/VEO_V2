services:
  veo-observatory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veo-observatory
    restart: unless-stopped
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
